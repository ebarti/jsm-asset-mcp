[project]
name = "jsm-asset-mcp"
version = "0.1.0"
description = "MCP server for Jira Service Management Assets (Insight) API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-runtime-kit==0.5.2",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
claude = ["agent-runtime-kit[claude]==0.5.2"]
codex = ["agent-runtime-kit[codex]==0.5.2"]
antigravity = ["agent-runtime-kit[antigravity]==0.5.2"]
gemini = ["agent-runtime-kit[antigravity]==0.5.2"]
all-providers = ["agent-runtime-kit[all]==0.5.2"]
