name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-extras --frozen

      - name: Run tests
        run: uv run --all-extras --frozen python -m unittest discover -s tests

      - name: Verify release version
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(Path("pyproject.toml").read_text())
          lock = tomllib.loads(Path("uv.lock").read_text())
          manifest = json.loads(Path("gemini-extension.json").read_text())
          version = project["project"]["version"]
          local = [package["version"] for package in lock["package"]
                   if package["name"] == "jsm-asset-mcp"]
          if tag != f"v{version}" or manifest["version"] != version or local != [version]:
              raise SystemExit("Tag, project, extension manifest, and lockfile versions differ")
          if f"## {version}" not in Path("CHANGELOG.md").read_text():
              raise SystemExit("CHANGELOG.md has no release notes for this version")
          print(f"Release metadata matches {tag}")
          PY

      - name: Build extension archive
        run: |
          mkdir -p dist
          python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"]
          artifact = Path("dist") / f"jsm-asset-mcp-{version}.tar.gz"
          files = [
              Path("gemini-extension.json"),
              Path("GEMINI.md"),
              Path("README.md"),
              Path("CHANGELOG.md"),
              Path("LICENSE"),
              Path("main.py"),
              Path("pyproject.toml"),
              Path("uv.lock"),
          ]
          files.extend(sorted(Path("jsm_asset_mcp").rglob("*.py")))
          files.extend(sorted(Path("docs").rglob("*.md")))
          files.extend(sorted(Path("docs").rglob("*.py")))
          files.append(Path("docs/examples/.env.example"))

          with tarfile.open(artifact, "w:gz") as tar:
              for path in files:
                  tar.add(path, arcname=path.as_posix())

          print(f"Created {artifact}")
          PY

      - name: Verify extension archive
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          artifacts = list(Path("dist").glob("*.tar.gz"))
          if len(artifacts) != 1:
              raise SystemExit(f"Expected one archive, found {artifacts}")

          with tarfile.open(artifacts[0], "r:gz") as tar:
              names = set(tar.getnames())

          required = {
              "gemini-extension.json",
              "GEMINI.md",
              "README.md",
              "CHANGELOG.md",
              "LICENSE",
              "main.py",
              "pyproject.toml",
              "uv.lock",
              "jsm_asset_mcp/server.py",
              "docs/tools.md",
              "docs/recipes.md",
              "docs/examples/stdio_client.py",
              "docs/examples/.env.example",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Archive missing required files: {missing}")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
